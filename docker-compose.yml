version: "3.8"

services:
  # FastAPI REST API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epc-intelligence-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Daily Scheduled / One-Off Batch Agent Run
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epc-intelligence-agent
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "main.py"]
    profiles:
      - cli
